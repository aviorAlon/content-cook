      else list.push(edited);
      const ok = await savePostLayers(episodeId, patchFor(kind), status);
      if (!ok) { // 回滚内存里的改动，别留一个跟磁盘不一致的假象
        if (isEdge) vo.edge = existing; else if (idx != null) list[idx] = existing; else list.pop();
      }
    }, isEdge ? '' : shotHint);
  };
  document.querySelectorAll('[data-pl-edit]').forEach(btn => {
    btn.onclick = () => openEditor(btn.dataset.plEdit, btn.dataset.plIdx != null ? Number(btn.dataset.plIdx) : null);
  });
  document.querySelectorAll('[data-pl-add]').forEach(btn => { btn.onclick = () => openEditor(btn.dataset.plAdd, null); });
  document.querySelectorAll('[data-pl-del]').forEach(btn => {
    btn.onclick = async () => {
      const kind = btn.dataset.plDel, idx = Number(btn.dataset.plIdx);
      const list = lists[kind]();
      const sure = await showConfirmModal(`删除这条${labels[kind]}？`, { confirmLabel: '删除' });
      if (!sure) return;
      const backup = list.splice(idx, 1);
      const status = document.getElementById('pl-status');
      const ok = await savePostLayers(episodeId, patchFor(kind), status);
      if (!ok) list.splice(idx, 0, ...backup);
    };
  });
}

function qcBadge(decision) {
  const cls = decision === 'pass' ? 'pass' : decision === 'waive' ? 'waive'
    : decision === 'retake' ? 'retake' : 'none';
  const label = { pass: '已通过', waive: '已豁免', retake: '待重摇' }[decision] || '待审';
  return `<span class="qc-badge ${cls}">${label}</span>`;
}

function reviewRow(shot, gate, hasArtifact) {
  if (!hasArtifact) return '';
  const decision = gate === 'frames' ? shot.frame_qc_decision : shot.video_qc_decision;
  if (decision === 'retake') {
    // 已经记了重摇：这一步的任务已被重置为「待重出」，再点重摇后端会拒（cannot retake while its
    // state is prepared）。这里直接告诉人下一步是什么，不再摆一个会报错的按钮。
    const unit = gate === 'frames' ? '首帧' : '视频';
    return `<div class="review-row" data-review-gate="${gate}">
      <span class="hint" style="margin:0;color:var(--chop)">已记重摇，等待重出 → 点上方「只出这镜${unit}」重新生成；重出后再审</span>
    </div>`;
  }
  return `<div class="review-row" data-review-gate="${gate}">
    <button class="review-btn pass" data-review-decision="pass">通过</button>
    <button class="review-btn retake" data-review-decision="retake">重摇</button>
  </div>`;
}

// 台词识别闸的逐镜结果：挂在视频下面一行。状态词汇跟 CLI 一致（pass/review/fail/silent/stray/no_lines）。
function asrLine(shot) {
  const a = shot.asr;
  if (!a) return '';
  const mark = { pass: '✓', review: '?', fail: '✗', silent: '✗', stray: '△', no_lines: '·', missing_video: '-' }[a.status] || '·';
  const label = { pass: '识别通过', review: '待复核', fail: '识别不符', silent: '没识别到语音', stray: '无台词镜里有语音', no_lines: '无台词', missing_video: '无视频' }[a.status] || a.status;
  const color = a.status === 'pass' || a.status === 'no_lines' ? 'var(--good)' : a.status === 'review' ? 'var(--warn)' : 'var(--bad)';
  const cer = typeof a.cer === 'number' ? ` · 字错率 ${a.cer}` : '';
  const heard = a.heard ? ` · 听到「${escapeHtml(a.heard)}」` : '';
  return `<div class="save-status" style="margin-top:4px;color:${color}" title="期望「${escapeHtml(a.expected || '')}」">${mark} ${label}${cer}${heard}</div>`;
}

function renderMediaRow(shot) {
  if (!shot.frame_url && !shot.video_url) return '';
  const frameCell = shot.frame_url ? `
    <div class="media-cell">
      <div class="cap"><span>首帧</span>${qcBadge(shot.frame_qc_decision)}</div>
      <img src="${shot.frame_url}" />
      ${reviewRow(shot, 'frames', true)}
    </div>` : '';
  const videoCell = shot.video_url ? `
    <div class="media-cell">
      <div class="cap"><span>视频</span>${qcBadge(shot.video_qc_decision)}</div>
      <video src="${shot.video_url}" controls preload="metadata"></video>
      ${asrLine(shot)}
      ${reviewRow(shot, 'videos', true)}
    </div>` : '';
  return `<div class="media-row">${frameCell}${videoCell}</div>`;
}

// 统一渲染函数：已保存项目的逐镜编辑和还没保存的草稿逐镜编辑长得一样、
// 编辑手感一样——区别只在于"保存这一镜"点下去调的是哪个
// 端点，那部分交给调用方通过 wireShotHandlers 的 onSave 回调决定，这里不关心。
// opts: { editable, showGenRow }——showGenRow 单独一个开关而不是复用 editable，
// 是因为"能不能改文字"和"能不能花钱单出这一镜"是两件独立的事：已锁定项目
// editable=false 但 showGenRow 可能是 true，未锁定草稿反过来。
function renderShot(shot, opts) {
  const { editable, showGenRow, extraActionsHtml: extraActions } = opts || {};
  const b = shot.budget;
  const bcls = budgetClass(b);
  const budgetHtml = b
    ? `<span class="budget ${bcls}">台词 ${b.dialogue_chars} 字 ≈${b.speech_seconds}s / 声明 ${b.declared_dur}s</span>`
    : '';
  const linesRows = shot.lines.map((l, i) => `
    <tr data-idx="${i}">
      <td class="who">${l.who}</td>
      <td class="win">${l.subtitle_start_seconds != null ? l.subtitle_start_seconds.toFixed(1) + '–' + l.subtitle_end_seconds.toFixed(1) + 's' : ''}</td>
      <td><textarea ${editable ? '' : 'readonly'} data-field="zh">${escapeHtml(l.zh)}</textarea>
        <textarea ${editable ? '' : 'readonly'} data-field="tone" rows="1" placeholder="语气 / 音量 / 语速 / 状态（例：压低声音，带点不耐烦，语速偏快）" style="margin-top:4px;font-size:11.5px;color:var(--dim)">${escapeHtml(l.tone || '')}</textarea></td>
    </tr>`).join('');

  let cameraControl = '';
  if (editable && state.cameraOptions) {
    const opts2 = state.cameraOptions.shots.map(s =>
      `<option value="${s.id}" ${shot.camera_move === s.id ? 'selected' : ''}>${s.cn}（${s.risk}）</option>`
    ).join('');
    cameraControl = `
      <select data-field="camera_move">
        <option value="">（不声明运镜）</option>
        ${opts2}
      </select>`;
  } else if (shot.camera_move) {
    cameraControl = `<span class="save-status">运镜：${shot.camera_move}</span>`;
  }

  const saveRow = editable ? `
    <div class="row2">
      ${cameraControl}
      <button class="save-btn compact" data-action="save">保存这一镜</button>
      <span class="save-status"></span>
    </div>` : (cameraControl ? `<div class="row2">${cameraControl}</div>` : '');

  // 「风格试跑」：先出一两镜看风格，不用整批生成——后端 generate-estimate/generate
  // 本来就支持 only 参数，这里只是把它暴露成每一镜的小按钮。只有锁定后（能生成的
  // 状态）才显示，草稿阶段还没到能调付费接口的时候，调用方不传就是不显示。
  const shotGenRow = showGenRow ? `<div class="row2">
        <button class="gen-btn spend" data-shot-gen="frames" data-shot-id="${shot.id}">只出这镜首帧</button>
        <button class="gen-btn spend" data-shot-gen="videos" data-shot-id="${shot.id}">只出这镜视频</button>
      </div>` : '';

  // shot_error 只有草稿态的 _draft_shot_view 会给（某一镜编译失败，比如运镜
  // 不合法）——已保存项目走的是 shot_detail，正常不会有这个字段，两边共用
  // 同一份渲染，加个判断就够了，不用拆两份模板。
  const errorHtml = shot.shot_error
    ? `<div class="warnings" style="margin:8px 0 0">⚠ 这一镜没通过校验：${escapeHtml(shot.shot_error)}</div>`
    : '';

  return `
  <div class="shot" id="shot-${shot.id}" data-shot-id="${shot.id}">
    <div class="shot-top">
      <div>
        <span class="sid">${shot.id}</span>
        <div class="shot-meta">cast: ${(shot.cast || []).join(', ') || '（无）'} · ref_frame: ${shot.ref_frame || '（独立首帧）'}${shot.dur != null ? ` · dur: ${shot.dur}s` : ''}</div>
      </div>
      ${budgetHtml}
    </div>
    ${shotGenRow}
    ${renderMediaRow(shot)}
    <table class="lines"><tbody>${linesRows || '<tr><td colspan="3" style="color:var(--dim)">（本镜无台词）</td></tr>'}</tbody></table>
    ${saveRow}
    ${extraActions || ''}
    ${errorHtml}
    <details>
      <summary>首帧提示词</summary>
      <pre>${escapeHtml(shot.frame_prompt)}</pre>
    </details>
    <details>
      <summary>负向提示词</summary>
      <pre>${escapeHtml(shot.neg_prompt)}</pre>
    </details>
    <details>
      <summary>视频提示词</summary>
      <pre>${escapeHtml(shot.video_prompt)}</pre>
    </details>
  </div>`;
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// 通用逐镜「保存」接线——已保存项目和还没保存的草稿共用同一套 DOM 读取/
// payload 拼装逻辑，只有"保存之后调哪个接口、拿到结果怎么
// 更新页面"这部分因为草稿态没有磁盘文件、没有 episode_id 而不同，所以拆成
// 一个 onSave(shotId, payload, status) 回调，由调用方决定。
// getOriginalShot(shotId) 用于取"没被编辑过的原始行"（who/timing 这些字段
// 界面上不给改，要从原始数据里带过去，不能凭编辑框内容瞎猜）。
function wireShotHandlers(getOriginalShot, onSave) {
  document.querySelectorAll('.shot').forEach(shotEl => {
    const shotId = shotEl.dataset.shotId;
    const btn = shotEl.querySelector('[data-action="save"]');
    if (!btn) return;
    btn.onclick = async () => {
      const status = shotEl.querySelector('.save-status');
      status.className = 'save-status';
      status.textContent = '保存中…';
      const original = getOriginalShot(shotId);
      // [data-idx] 排除「本镜无台词」的占位行——那一行是纯展示，没有对应的
      // lines[] 下标，真人点这个镜次的保存按钮时崩过一次，就是漏了这个过滤。
      const lines = [...shotEl.querySelectorAll('table.lines tr[data-idx]')].map(tr => {
        const idx = Number(tr.dataset.idx);
        const originalLine = original.lines[idx];
        return {
          who: originalLine.who,
          zh: tr.querySelector('textarea[data-field="zh"]').value,
          tone: tr.querySelector('textarea[data-field="tone"]')?.value ?? '',
          subtitle_start_seconds: originalLine.subtitle_start_seconds,
          subtitle_end_seconds: originalLine.subtitle_end_seconds,
        };
      });
      const cameraSelect = shotEl.querySelector('select[data-field="camera_move"]');
      const payload = { lines };
      if (cameraSelect) payload.camera_move = cameraSelect.value || null;
      try {
        await onSave(shotId, payload, status, shotEl);
      } catch (e) {
        status.className = 'save-status err';
        status.textContent = '保存失败：' + e.message;
      }
    };
  });
}

// 已保存项目的逐镜保存：PUT 到真实的项目文件端点。
async function saveEpisodeShot(shotId, payload, status) {
  const result = await api(
    `/api/episodes/${state.current.pipeline}/${state.current.id}/shots/${shotId}`,
    { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }
  );
  // renderEpisode() 重建整页 DOM，先设置状态文字再重渲染等于白设置——
  // 真人点击测出来的：成功提示 0 毫秒就被冲掉了，用户根本看不到。
  // 重渲染之后再到新 DOM 里找那个镜次的状态位，把提示补上。
  const idx = state.current.detail.shots.findIndex(s => s.id === shotId);
  state.current.detail.shots[idx] = result.shot;
  state.current.detail.warnings = result.warnings;
  renderEpisode();
  const freshStatus = document.querySelector(`.shot[data-shot-id="${shotId}"] .save-status`);
  if (freshStatus) { freshStatus.className = 'save-status ok'; freshStatus.textContent = '已保存'; }
}

// 还没保存的草稿的逐镜保存：POST 到 /api/scripts/draft/shot，不花钱、不落盘，
// 纯内存里的 spec 合并+重新校验+重新编译预览。
//
// 基准 spec 从 #draft-json 编辑框的当前内容现读，不是 resp.spec 闭包里的
// 旧值——这份 JSON 编辑框仍然是"兜底"的结构性编辑入口（加/删镜次这类），
// 人可能刚在里面手改过、还没点"保存为新项目"；如果这里用闭包里的旧 resp.spec
// 去发请求，等结果回来重新渲染，会把 textarea 里那些还没提交的手改内容
// 悄悄冲掉——这跟 regenerateDraftShot 一直以来"从 #draft-json 现读"是
// 同一个信任模型，不能这里单独抄一份旧状态。
async function saveDraftShot(episodeId, resp, shotId, payload, status) {
  let currentSpec;
  try {
    currentSpec = JSON.parse(document.getElementById('draft-json').value);
  } catch (e) {
    throw new Error('下面的 JSON 编辑框内容格式不对，先修好再保存这一镜：' + e.message);
  }
  const result = await api('/api/scripts/draft/shot', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ spec: currentSpec, shot_id: shotId, ...payload }),
  });
  resp.spec = result.spec;
  resp.warnings = result.warnings;
  resp.shots = result.shots;
  renderDraftPreview(episodeId, resp);
  const freshStatus = document.querySelector(`.shot[data-shot-id="${shotId}"] .save-status`);
  if (freshStatus) { freshStatus.className = 'save-status ok'; freshStatus.textContent = '已保存'; }
}

// 「基础配置」管理页：镜头语言库/风格骨架库这两份所有项目共用的库，之前只能
// 靠改 Python 脚本再重跑才能加一个新 profile——现在能在这里逐条增删改，存盘
// 立刻生效（后端清缓存，不用重启服务）。编辑/新增一条只弹出那一条的小 JSON
// （几行到几十行），不是把几万字符的整份文档甩给人从头翻——那是上一版的
// 真实教训：技术上算"能编辑"，实际没法用。整份 JSON 编辑框还留着一个兜底
// 入口，给还没做成逐条表单的部分（风格骨架/检查清单）用，不是主路径。
async function showConfigPage() {
  document.querySelectorAll('aside .item.active').forEach(el => el.classList.remove('active'));
  const main = document.getElementById('main');
  main.innerHTML = '<div class="empty">加载配置…</div>';
  try {
    const [cam, style] = await Promise.all([
      api('/api/config/camera-library'),
      api('/api/config/style-library'),
    ]);
    state.configCam = cam;
    state.configStyle = style;
  } catch (e) {
    main.innerHTML = `<div class="empty">加载配置失败：${e.message}</div>`;
    return;
  }
  renderConfigPage();
}

// 单条记录的小编辑弹窗——复用 .modal-overlay/.modal-box，宽一点、textarea 矮一点，
// 因为装的是"一条镜头/一条负向词"这种量级，不是整份文档。
function showItemJsonModal(title, itemObj, onSave, extraFieldsHtml) {
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box" style="width:620px">
      <h3>${escapeHtml(title)}</h3>
      ${extraFieldsHtml || ''}
      <textarea class="draft-json" id="item-json-editor" style="min-height:240px">${escapeHtml(JSON.stringify(itemObj, null, 2))}</textarea>
      <div class="row2" style="align-items:center">
        <span class="save-status" id="item-json-status"></span>
        <button class="cancel-btn" data-modal-cancel style="margin-left:auto">取消</button>
        <button class="save-btn" data-modal-save>保存</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('[data-modal-cancel]').onclick = closeModal;
  overlay.querySelector('[data-modal-save]').onclick = () => withProgress(async () => {
    const status = document.getElementById('item-json-status');
    status.className = 'save-status';
    let parsed;
    try {
      parsed = JSON.parse(document.getElementById('item-json-editor').value);
    } catch (e) {
      status.className = 'save-status err';
      status.textContent = 'JSON 格式不对：' + e.message;
      return;
    }
    await onSave(parsed, status);
  });
}

// 「带 id 的对象数组」通用增删改——镜头/组合内/镜头组/负向词池这四个集合结构
// 完全一样（数组，每条记录有 id 字段），一套函数管四个，不用分别写四遍。
function editArrayItem({ doc, apiPath, collectionKey, itemId, template, itemLabel, onSaved }) {
  const list = doc[collectionKey] || (doc[collectionKey] = []);
  const existing = itemId ? list.find(x => x.id === itemId) : null;
  const title = existing ? `编辑${itemLabel}：${itemId}` : `新增${itemLabel}`;
  showItemJsonModal(title, existing || template, async (edited, status) => {
    if (!edited.id) { status.className = 'save-status err'; status.textContent = 'id 字段必填'; return; }
    if (!existing && list.some(x => x.id === edited.id)) {
      status.className = 'save-status err'; status.textContent = `id ${edited.id} 已经存在`; return;
    }
    const idx = list.findIndex(x => x.id === (existing ? itemId : edited.id));
    if (existing && idx === -1) {
      status.className = 'save-status err'; status.textContent = '原记录找不到了，刷新页面重试'; return;
    }
    status.textContent = '保存中…';
    const backup = [...list];
    if (existing) list[idx] = edited; else list.push(edited);
    try {
      await api(apiPath, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ data: doc }) });
    } catch (e) {
      doc[collectionKey] = backup; // 存失败，回滚内存里的临时改动，不留一个跟服务端不一致的假象
      status.className = 'save-status err'; status.textContent = '保存失败：' + e.message;
      return;
    }
    closeModal();
    if (onSaved) onSaved();
  });
}

async function deleteArrayItem({ doc, apiPath, collectionKey, itemId, itemLabel, onSaved }) {
  const sure = await showConfirmModal(`确定删除${itemLabel}「${itemId}」？如果有 profile 还在引用它，保存时会被拒绝。`);
  if (!sure) return;
  await withProgress(async () => {
    const list = doc[collectionKey] || [];
    const backup = [...list];
    doc[collectionKey] = list.filter(x => x.id !== itemId);
    try {
      await api(apiPath, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ data: doc }) });
    } catch (e) {
      doc[collectionKey] = backup;
      showNoticeModal('删除失败：' + e.message);
      return;
    }
    if (onSaved) onSaved();
  });
}

// profiles 是「按名字做 key 的字典」，名字本身不是记录里的字段，新增时要多问
// 一句名字叫什么——跟数组集合的形状不一样，所以是单独一套函数，不硬塞进上面
// 那套里。
function editProfile({ doc, apiPath, profileName, template, onSaved }) {
  const profiles = doc.profiles || (doc.profiles = {});
  const existing = profileName ? profiles[profileName] : null;
  const title = existing ? `编辑 profile：${profileName}` : '新增 profile';
  const nameFieldHtml = existing ? '' : `
    <div class="field-row"><label>profile 名称（英文 slug，比如 night_market_duo）</label>
      <input type="text" id="new-profile-name" /></div>`;
  showItemJsonModal(title, existing || template, async (edited, status) => {
    let name = profileName;
    if (!existing) {
      name = document.getElementById('new-profile-name')?.value.trim();
      if (!name) { status.className = 'save-status err'; status.textContent = 'profile 名称必填'; return; }
      if (profiles[name]) { status.className = 'save-status err'; status.textContent = `profile ${name} 已经存在`; return; }
    }
    status.textContent = '保存中…';
    const backup = { ...profiles };
    profiles[name] = edited;
    try {
      await api(apiPath, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ data: doc }) });
    } catch (e) {
      doc.profiles = backup;
      status.className = 'save-status err'; status.textContent = '保存失败：' + e.message;
      return;
    }
    closeModal();
    if (onSaved) onSaved();
  }, nameFieldHtml);
}

async function deleteProfile({ doc, apiPath, profileName, onSaved }) {
  const sure = await showConfirmModal(`确定删除 profile「${profileName}」？`);
  if (!sure) return;
  await withProgress(async () => {
    const backup = { ...doc.profiles };
    delete doc.profiles[profileName];
    try {
      await api(apiPath, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ data: doc }) });
    } catch (e) {
      doc.profiles = backup;
      showNoticeModal('删除失败：' + e.message);
      return;
    }
    if (onSaved) onSaved();
  });
}

// frame_style_skeletons（单个对象）和 scene_anchor_checklists（数组）按 profile
// 名字成对存在——后端校验强制两边的 profile 集合必须完全一致（config_validate.py
// validate_style_library），单独改一边很容易存出一个校验会拒绝、还搞不清哪里
// 错了的半成品。所以这里不拆成两套独立 CRUD，一个 profile 名字下的 skeleton +
// checklist 当成一条记录一起编辑、一起删——跟"带 id 的对象数组"/"扁平 profile
// 字典"都不是同一种形状，单独写一套，不硬塞进 editArrayItem/editProfile。
function editStyleSkeletonProfile({ doc, apiPath, profileName, template, onSaved }) {
  const skeletons = doc.frame_style_skeletons || (doc.frame_style_skeletons = {});
  const checklists = doc.scene_anchor_checklists || (doc.scene_anchor_checklists = {});
  const existing = profileName
    ? { skeleton: skeletons[profileName] || {}, checklist: checklists[profileName] || [] }
    : null;
  const title = existing ? `编辑风格骨架 profile：${profileName}` : '新增风格骨架 profile';
  const nameFieldHtml = existing ? '' : `
    <div class="field-row"><label>profile 名称（要跟镜头语言库的 camera_profile 同名，
    起草流程才会用上，比如 dark_comedy_vertical）</label>
      <input type="text" id="new-skeleton-profile-name" /></div>`;
  showItemJsonModal(title, existing || template, async (edited, status) => {
    let name = profileName;
    if (!existing) {
      name = document.getElementById('new-skeleton-profile-name')?.value.trim();
      if (!name) { status.className = 'save-status err'; status.textContent = 'profile 名称必填'; return; }
      if (skeletons[name] || checklists[name]) {
        status.className = 'save-status err'; status.textContent = `profile ${name} 已经存在`; return;
      }
    }
    if (!edited.skeleton || typeof edited.skeleton !== 'object' || Array.isArray(edited.skeleton)) {
      status.className = 'save-status err'; status.textContent = 'skeleton 字段必须是一个对象（不是数组）'; return;
    }
    if (!Array.isArray(edited.checklist)) {
      status.className = 'save-status err'; status.textContent = 'checklist 字段必须是一个数组'; return;
    }
    status.textContent = '保存中…';
    const backupSk = { ...skeletons }, backupCl = { ...checklists };
    skeletons[name] = edited.skeleton;
    checklists[name] = edited.checklist;
    try {
      await api(apiPath, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ data: doc }) });
    } catch (e) {
      doc.frame_style_skeletons = backupSk; doc.scene_anchor_checklists = backupCl;
      status.className = 'save-status err'; status.textContent = '保存失败：' + e.message;
      return;
    }
    closeModal();
    if (onSaved) onSaved();
  }, nameFieldHtml);
}

async function deleteStyleSkeletonProfile({ doc, apiPath, profileName, onSaved }) {
  const sure = await showConfirmModal(`确定删除风格骨架 profile「${profileName}」？skeleton 和 checklist 会一起删。`);
  if (!sure) return;
  await withProgress(async () => {
    const skeletons = doc.frame_style_skeletons || {};
    const checklists = doc.scene_anchor_checklists || {};
    const backupSk = { ...skeletons }, backupCl = { ...checklists };
    delete skeletons[profileName];
    delete checklists[profileName];
    try {
      await api(apiPath, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ data: doc }) });
    } catch (e) {
      doc.frame_style_skeletons = backupSk; doc.scene_anchor_checklists = backupCl;
      showNoticeModal('删除失败：' + e.message);
      return;
    }
    if (onSaved) onSaved();
  });
}

  const skeletons = style.frame_style_skeletons || {};
  const checklists = style.scene_anchor_checklists || {};

  const rowActions = (editFn, delFn) =>
    `<td style="white-space:nowrap"><button class="review-btn" data-act="edit">改</button>
     <button class="review-btn retake" data-act="del">删</button></td>`;

  const shotRows = shots.map(s => `
    <tr data-id="${escapeHtml(s.id)}">
      <td>${escapeHtml(s.id)}</td><td>${escapeHtml(s.cn || '')}</td>
      <td>${escapeHtml(s.cat || '')}</td><td>${escapeHtml(s.risk || '')}</td>
      ${rowActions()}
    </tr>`).join('');
  const comboWithinRows = combosWithin.map(c => `
    <tr data-id="${escapeHtml(c.id)}">
      <td>${escapeHtml(c.id)}</td><td>${escapeHtml(c.cn || '')}</td><td>${escapeHtml(c.risk || '')}</td>
      ${rowActions()}
    </tr>`).join('');
  const comboSeqRows = combosSeq.map(c => `
    <tr data-id="${escapeHtml(c.id)}">

      ${rowActions()}
    </tr>`).join('');
  const profileRows = Object.entries(profiles).map(([name, p]) => `

      <td>${escapeHtml(name)}</td>

      <td>${(p.allow || []).length}</td><td>${(p.combos || []).length}</td>
      <td>${p.max_moves_per_episode ?? '无限制'}</td>
      ${rowActions()}
    </tr>`).join('');
  const negRows = negPool.map(n => `
    <tr data-id="${escapeHtml(n.id)}">
      <td>${escapeHtml(n.id)}</td><td>${escapeHtml(n.cn || '')}</td><td>${escapeHtml(n.tier || '')}</td>
      ${rowActions()}
    </tr>`).join('');
  const skeletonRows = skeletonNames.map(name => {
    const sk = skeletons[name] || {};
    const cl = checklists[name] || [];
    const mismatch = !(name in skeletons) || !(name in checklists);
    return `
    <tr data-id="${escapeHtml(name)}">
      <td>${escapeHtml(name)}${mismatch ? ' <span class="badge error">skeleton/checklist 缺一半</span>' : ''}</td>

    status.className = 'save-status err';

  status.textContent = '保存中…';

    status.textContent = '保存失败：' + e.message;
    return;
  }
  onSaved();
}

const JOB_POLL_INTERVAL_MS = 4000;

// job 提交即返回 job_id，真正的生成在服务端后台线程跑——这个轮询只是「当前
// 这个标签页恰好还开着」时用来实时刷新进度，跟服务端是否还在跑完全解耦：
// 就算这个轮询循环因为切页面/关标签页而死掉，job 本身照样在磁盘上跑完，
// 下次进页面会被 checkPendingJobs() 的恢复条捞回来。
// stopToken 停的是"前端还盯不盯着看"，不是 job 本身——job 是后台线程真的在
// 跑（真花钱/真耗用量），前端脚本停了它也照样跑完、照样写进 job 记录，回到
// 首页的恢复条（checkPendingJobs）还能找到。这跟 pollGenerate 的 stopToken
// 是同一个诚实边界：要的是"能停止盯着看"，不是一个技术上做
// 不到的"真取消"承诺。
async function pollScriptJob(jobId, onTick, stopToken) {
  const startedAt = Date.now();
  while (true) {
    if (stopToken && stopToken.stopped) return { status: 'watch_stopped', job_id: jobId };
    const job = await api(`/api/scripts/jobs/${jobId}`);
    const elapsed = Math.round((Date.now() - startedAt) / 1000);
    if (onTick) onTick(job, elapsed);
    if (job.status === 'succeeded' || job.status === 'failed') return job;
    await new Promise(r => setTimeout(r, JOB_POLL_INTERVAL_MS));
  }
}

async function submitNewProjectForm() {
  const form = document.querySelector('.new-project-form');
  const get = f => form.querySelector(`[data-f="${f}"]`).value;
  const payload = {
    episode_id: get('episode_id').trim(),
    direction: get('direction'),
    target_seconds: Number(get('target_seconds')) || 90,
    camera_profile: get('camera_profile'),
    prompt_language: get('prompt_language'),
    cast_hint: get('cast_hint').trim() || null,
  };
  if (!payload.episode_id || !payload.direction.trim()) {
    showNoticeModal('项目 id 和大致方向都要填');
    return;
  }
  const status = document.getElementById('gen-draft-status');
  status.className = 'gen-status';
  document.getElementById('gen-draft-btn').disabled = true;
  let jobId;
  try {
    const created = await api('/api/scripts/jobs/draft', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    jobId = created.job_id;
  } catch (e) {
    status.className = 'gen-status err';
    status.textContent = '提交失败：' + e.message;
    document.getElementById('gen-draft-btn').disabled = false;
    return;
  }
  let job;
  const stopToken = makeStopToken();
  try {
    job = await pollScriptJob(jobId, (j, elapsed) => {
      const s = document.getElementById('gen-draft-status');
      if (s) {
        s.textContent = `生成中…已经 ${elapsed}s（可以放心切走/刷新页面，进度记在服务端，回来能在页面顶部找回）`;
        ensureStopButton(s, stopToken, '停止查看进度');
      }
    }, stopToken);
  } catch (e) {
    removeStopButton();
    status.className = 'gen-status err';
    status.textContent = `轮询失败：${e.message}（job 可能还在跑，回到首页看顶部的恢复条）`;
    document.getElementById('gen-draft-btn').disabled = false;
    return;
  }
  removeStopButton();
  if (job.status === 'watch_stopped') {
    status.className = 'gen-status';
    status.textContent = '已停止查看进度——起草仍在后台跑，真花的钱/用量不受影响，回到首页顶部的恢复条能找回结果。';
    document.getElementById('gen-draft-btn').disabled = false;
    return;
  }
  if (job.status === 'failed') {
    status.className = 'gen-status err';
    status.textContent = '生成失败：' + job.error;
    document.getElementById('gen-draft-btn').disabled = false;
    return;
  }
  renderDraftPreview(payload.episode_id, job.result);
}

// 项目级花费汇总：job 记录从不删除，天然是这个项目从起草到
// 现在的完整花费明细，这里只是聚合展示。美元价和 tokens 分开累计——两种后端
// 不是同一个计价单位，不能加在一起充数。draft-preview（未保存）和已保存项目
// 详情页共用这份聚合逻辑，避免两处各写一套算法各自出错。
function costSummaryHtml(succeeded) {
  let totalCost = 0, costCount = 0, totalTokens = 0, tokensOnlyCount = 0;
  for (const j of succeeded) {
    const cost = j.result?.cost_usd, tokens = j.result?.usage_tokens;
    if (typeof cost === 'number') { totalCost += cost; costCount++; }
    else if (typeof tokens === 'number') { totalTokens += tokens; tokensOnlyCount++; }
  }
  const parts = [];
  if (costCount) parts.push(`<b>$${totalCost.toFixed(4)}</b>（${costCount} 次）`);
  if (tokensOnlyCount) parts.push(`<b>${totalTokens}</b> tokens（${tokensOnlyCount} 次，这条后端不直接报美元价）`);
  if (!parts.length) return '';
  return `<div class="cost-summary">这个项目从起草到现在累计花费：${parts.join(' + ')}，
    共 ${succeeded.length} 次成功调用（含整份起草和单镜重写，失败的调用不算钱）。</div>`;
}

// 已保存/已锁定项目详情页：只展示花费汇总，不带版本历史表——"恢复这个版本"
// 这个动作是拿 job 里存的 spec 整份替换 #draft-json 编辑框，只在未保存的
// 草稿预览页里有意义；锁定项目页面没有那个编辑框，硬塞一样的表会诱导点一个
// 语义不对的按钮。要看完整版本历史，去起草流程本身的记录里看。
async function renderCostSummary(episodeId) {
  const container = document.getElementById('job-history');
  if (!container) return;
  let jobs;
  try {
    jobs = await api(`/api/scripts/jobs?episode_id=${encodeURIComponent(episodeId)}`);
  } catch (e) {
    return;
  }
  container.innerHTML = costSummaryHtml(jobs.filter(j => j.status === 'succeeded'));
}

async function renderJobHistory(episodeId) {
  const container = document.getElementById('job-history');
  if (!container) return;
  let jobs;
  try {
    jobs = await api(`/api/scripts/jobs?episode_id=${encodeURIComponent(episodeId)}`);
  } catch (e) {
    return;
  }
  const succeeded = jobs.filter(j => j.status === 'succeeded');
  if (!succeeded.length) { container.innerHTML = ''; return; }
  const summaryHtml = costSummaryHtml(succeeded);

  // job 记录从不删除，一个反复打磨的项目历史会一直涨——只展示最近 20 条，
  // 更早的版本仍然全部留在磁盘上（jobs 接口本身不分页），只是不在这里堆出来；
  // 花费汇总用的是全部 succeeded（不受这个展示上限影响），不会漏算早期版本。
  const HISTORY_DISPLAY_CAP = 20;
  const shown = succeeded.slice(0, HISTORY_DISPLAY_CAP);
  const omittedNote = succeeded.length > HISTORY_DISPLAY_CAP
    ? `<p style="color:var(--dim);font-size:11.5px">还有 ${succeeded.length - HISTORY_DISPLAY_CAP} 条更早的版本没有列出（都还在磁盘上，没有丢）。</p>`
    : '';
  const rows = shown.map(j => {
    const when = new Date(j.created_at * 1000).toLocaleString();
    const kindLabel = j.kind === 'regenerate_shot' ? `重写单镜（${j.params?.shot_id || ''}）` : '整份起草';
    const costLabel = typeof j.result?.cost_usd === 'number' ? `$${j.result.cost_usd.toFixed(4)}`
      : (typeof j.result?.usage_tokens === 'number' ? `${j.result.usage_tokens} tokens` : '');
    return `<tr>
      <td>${when}</td><td>${kindLabel}</td><td>${costLabel}</td>
      <td><button class="review-btn" data-restore-job="${j.job_id}">恢复这个版本</button></td>
    </tr>`;
  }).join('');
  container.innerHTML = summaryHtml + `
    <details style="margin-top:12px">
      <summary>版本历史（${succeeded.length} 次尝试，每次都真花过钱/用量，点"恢复"会用那个版本整份替换当前编辑框）</summary>
      <table style="width:100%;font-size:12px;margin-top:8px"><tbody>${rows}</tbody></table>
      ${omittedNote}
    </details>`;
  container.querySelectorAll('[data-restore-job]').forEach(btn => {
    btn.onclick = async () => {
      const job = await api(`/api/scripts/jobs/${btn.dataset.restoreJob}`);
      if (job.result) renderDraftPreview(episodeId, job.result);
    };
  });
}

function renderDraftPreview(episodeId, resp) {
  const main = document.getElementById('main');
  let html = `<div class="ep-header"><h2>${episodeId}（草稿，尚未保存）</h2>`;
  const backendLabel = resp.backend === 'openai_proxy' ? 'LLM 代理' : resp.backend === 'claude_cli' ? 'claude CLI' : resp.backend || '';
  if (typeof resp.cost_usd === 'number') {
    html += `<span class="save-status">${backendLabel} · 实际花费 $${resp.cost_usd.toFixed(4)}</span>`;
  } else if (typeof resp.usage_tokens === 'number') {
    html += `<span class="save-status">${backendLabel} · 用了 ${resp.usage_tokens} tokens（这条后端不直接报美元价）</span>`;
  } else if (backendLabel) {
    html += `<span class="save-status">${backendLabel}</span>`;
  }
  html += '</div>';
  if (resp.warnings && resp.warnings.length) {
    html += '<div class="warnings">' + resp.warnings.map(w => `<div>⚠ ${w}</div>`).join('') + '</div>';
  }
  html += `<p style="color:var(--dim);font-size:12.5px">${escapeHtml(resp.spec.title_zh || '')} — ${escapeHtml(resp.spec.logline || '')}</p>`;
  html += `<div id="job-history"></div>`;
  // 草稿态逐镜编辑跟已保存项目共用同一套 renderShot/
  // wireShotHandlers——之前这里是只读文字 + 底下一整块 JSON 编辑框，改一句
  // 台词得在几十上百行 JSON 里找那一个字段。现在跟保存后的编辑手感一样：
  // 每一镜有自己的文本框/运镜下拉框，"重写这一镜"（会调用 AI、真花钱）作为
  // 额外操作项附加在同一张卡片上，跟免费的"保存这一镜"（纯本地合并，不调用
  // AI）用视觉分层区分开（.save-btn.compact vs .gen-btn.spend）。
  for (const shot of resp.shots) {
    const extraActionsHtml = `<div class="row2" style="margin-top:8px">
      <button class="gen-btn spend" data-regen-shot="${shot.id}">重写这一镜（调用 AI，只花这一镜的钱，不动其它镜次）</button>
    </div>`;
    html += renderShot(shot, { editable: true, showGenRow: false, extraActionsHtml });
  }
  html += `
    <div class="new-project-form" style="margin-top:16px">
      <h3 style="margin-top:0">兜底：直接编辑整份 JSON</h3>
      <p style="color:var(--dim);font-size:12.5px">上面每一镜的文本框/下拉框已经覆盖日常编辑；这个整份 JSON
      编辑框留给结构性改动（加/删镜次、改 cast、改 output_root 这类逐镜表单没覆盖的字段）。
      改完文本再点保存；保存前会重新走一遍结构+镜头库校验，校验不过不会写盘。</p>
      <textarea class="draft-json" id="draft-json">${escapeHtml(JSON.stringify(resp.spec, null, 2))}</textarea>
      <div class="row2" style="margin-top:10px">
        <button class="gen-btn spend" id="draft-regen-btn">重新生成整份草稿（再次调用 API，再产生一次费用）</button>
        <button class="save-btn" id="draft-save-btn">保存为新项目</button>
        <span class="gen-status" id="draft-save-status"></span>
      </div>
    </div>`;
  main.innerHTML = html;
  wireShotHandlers(
    shotId => resp.shots.find(s => s.id === shotId),
    (shotId, payload, status) => saveDraftShot(episodeId, resp, shotId, payload, status),
  );
  document.getElementById('draft-regen-btn').onclick = showNewProjectForm;
  document.getElementById('draft-save-btn').onclick = () => withProgress(() => saveDraft(episodeId));
  document.querySelectorAll('[data-regen-shot]').forEach(btn => {
    btn.onclick = () => withProgress(() => regenerateDraftShot(episodeId, btn.dataset.regenShot));
  });
  renderJobHistory(episodeId);
}

async function regenerateDraftShot(episodeId, shotId) {
  const feedback = await showPromptModal(`这一镜（${shotId}）想怎么改？（可以留空，让模型自由改进）`, { placeholder: '留空 = 让模型自由改进', confirmLabel: '重写' });
  if (feedback === null) return; // 用户取消
  let spec;
  try {
    spec = JSON.parse(document.getElementById('draft-json').value);
  } catch (e) {
    showNoticeModal('当前 JSON 格式不对，先修好再重写单镜：' + e.message);
    return;
  }
  const btn = document.querySelector(`[data-regen-shot="${shotId}"]`);
  const originalLabel = '重写这一镜（只花这一镜的钱，不动其它镜次）';
  let jobId;
  try {
    const created = await api('/api/scripts/jobs/shot', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ episode_id: episodeId, spec, shot_id: shotId, feedback: feedback || null }),
    });
    jobId = created.job_id;
  } catch (e) {
    showNoticeModal('提交失败：' + e.message);
    return;
  }
  if (btn) btn.disabled = true;
  let job;
  const stopToken = makeStopToken();
  try {
    job = await pollScriptJob(jobId, (j, elapsed) => {
      if (btn) {
        btn.textContent = `重写中…${elapsed}s`;
        ensureStopButton(btn, stopToken, '停止查看');
      }
    }, stopToken);
  } catch (e) {
    removeStopButton();
    showNoticeModal(`轮询失败：${e.message}（job 可能还在跑，回到首页看顶部的恢复条）`);
    if (btn) { btn.disabled = false; btn.textContent = originalLabel; }
    return;
  }
  removeStopButton();
  if (job.status === 'watch_stopped') {
    if (btn) { btn.disabled = false; btn.textContent = originalLabel; }
    showNoticeModal('已停止查看进度——重写仍在后台跑，真花的钱/用量不受影响，回到首页顶部的恢复条能找回结果。');
    return;
  }
  if (job.status === 'failed') {
    showNoticeModal('重写失败：' + job.error);
    if (btn) { btn.disabled = false; btn.textContent = originalLabel; }
    return;
  }
  renderDraftPreview(episodeId, job.result);
}

async function saveDraft(episodeId) {
  const status = document.getElementById('draft-save-status');
  status.className = 'gen-status';
  let spec;
  try {
    spec = JSON.parse(document.getElementById('draft-json').value);
  } catch (e) {
    status.className = 'gen-status err';
    status.textContent = 'JSON 格式不对，改不动：' + e.message;
    return;
  }
  status.textContent = '保存中…';
  document.getElementById('draft-save-btn').disabled = true;
  try {
    await api('/api/scripts/save', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ episode_id: episodeId, spec }),
    });
  } catch (e) {
    status.className = 'gen-status err';
    status.textContent = '保存失败：' + e.message;
    document.getElementById('draft-save-btn').disabled = false;
    return;
  }
  await loadSidebar();
  await selectEpisode('storyvideo', episodeId);
  checkPendingJobs();
}

// 恢复条只关心两类 job：还在跑的（需要接着轮询）、成功了但这个 episode_id
// 还没保存成正式项目的（result 真花过钱，不该因为标签页关了就找不回）。
// 按 episode_id 去重只留最新一条，避免同一个项目重复尝试几次把条挤爆。
async function checkPendingJobs() {
  const banner = document.getElementById('cache-banner');
  let jobs;
  try {
    jobs = await api('/api/scripts/jobs');
  } catch (e) {
    return; // 静默失败——这只是个提醒条，不该因为它自己出错就干扰主流程
  }
  const byEpisode = {};
  for (const j of jobs) {
    if (j.dismissed) continue;
    if (j.saved) continue;
    if (!['pending', 'running', 'succeeded'].includes(j.status)) continue;
    const cur = byEpisode[j.episode_id];
    if (!cur || (j.created_at || 0) > (cur.created_at || 0)) byEpisode[j.episode_id] = j;
  }
  const entries = Object.values(byEpisode);
  if (!entries.length) { banner.innerHTML = ''; return; }
  banner.innerHTML = entries.map(j => {
    const running = j.status === 'pending' || j.status === 'running';
    const label = running ? '还在生成中' : '生成完了，还没保存';
    return `<div class="toast">
      <div class="toast-msg">⚠ <b>${j.episode_id}</b> ${label}（真花过钱/正在花钱，标签页关了也不会丢）</div>
      <div class="toast-actions">
        <button data-resume-job="${j.job_id}" data-resume-episode="${j.episode_id}">${running ? '查看进度' : '恢复查看'}</button>
        <button data-dismiss-job="${j.job_id}">不再提醒</button>
      </div>
    </div>`;
  }).join('');
  banner.querySelectorAll('[data-resume-job]').forEach(btn => {
    btn.onclick = () => withProgress(() => resumeJob(btn.dataset.resumeJob, btn.dataset.resumeEpisode));
  });
  banner.querySelectorAll('[data-dismiss-job]').forEach(btn => {
    btn.onclick = async () => {
      await api(`/api/scripts/jobs/${btn.dataset.dismissJob}/dismiss`, { method: 'POST' });
      checkPendingJobs();
    };
  });
}

async function resumeJob(jobId, episodeId) {
  document.querySelectorAll('aside .item.active').forEach(el => el.classList.remove('active'));
  const main = document.getElementById('main');
  main.innerHTML = '<div class="empty">恢复中…</div>';
  let job;
  try {
    job = await api(`/api/scripts/jobs/${jobId}`);
  } catch (e) {
    main.innerHTML = `<div class="empty">恢复失败：${e.message}</div>`;
    return;
  }
  if (job.status === 'succeeded' && job.result) {
    renderDraftPreview(episodeId, job.result);
    return;
  }
  if (job.status === 'failed') {
    main.innerHTML = `<div class="empty">这次尝试失败了：${escapeHtml(job.error || '')}</div>`;
    return;
  }
  // 还在跑：接着轮询，跟第一次提交时是同一个视觉状态
  main.innerHTML = `<div class="new-project-form"><h2 style="margin-top:0">${episodeId}</h2>
    <span class="gen-status" id="gen-draft-status">恢复轮询中…</span></div>`;
  let resumed;
  const stopToken = makeStopToken();
  try {
    resumed = await pollScriptJob(jobId, (j, elapsed) => {
      const s = document.getElementById('gen-draft-status');
      if (s) {
        s.textContent = `生成中…已经 ${elapsed}s`;
        ensureStopButton(s, stopToken, '停止查看进度');
      }
    }, stopToken);
  } catch (e) {
    removeStopButton();
    return;
  }
  removeStopButton();
  if (resumed.status === 'watch_stopped') {
    const s = document.getElementById('gen-draft-status');
    if (s) s.textContent = '已停止查看进度——仍在后台跑，回到首页顶部的恢复条能再次找回。';
    return;
  }
  if (resumed.status === 'succeeded') renderDraftPreview(episodeId, resumed.result);
  else showNoticeModal('生成失败：' + resumed.error);
}

// 先拿环境状态再画侧边栏——空状态引导第一步要按角色配置状态盖章
loadHealth().then(() => loadSidebar());
checkPendingJobs();
</script>
